
<!DOCTYPE html>
<html>
<head>
    <title>Weekly Schedule</title>

    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            padding: 50px;
        }

        h1 {
            font-size: 40px;
        }

        table {
            width: 650px;
            border: 4px double black;
            border-spacing: 0;
            font-size: 20px;
        }

        th, td {
            border: 3px double black;
            padding: 10px;
        }

        th {
            text-align: center;
        }

        td {
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>Weekly Schedule</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Math</td>
            <td>Science</td>
            <td>History</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>English</td>
            <td>PE</td>
            <td>Art</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Math</td>
            <td>Science</td>
            <td>History</td>
        </tr>
    </table>

</body>
</html>
